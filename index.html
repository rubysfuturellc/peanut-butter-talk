<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>The Last Time America Agreed on Anything</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: Arial, Helvetica, sans-serif; }
  video { display: block; max-width: 100vw; max-height: calc(100vh - 70px); width: auto; height: auto; aspect-ratio: 16 / 9; background: #000; cursor: pointer; }
  button { font: 600 16px Arial, Helvetica, sans-serif; color: #111; background: #f3ecd9; border: 0; border-radius: 4px; padding: 10px 26px; min-width: 110px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #c39a1e; outline-offset: 2px; }
</style>
</head>
<body>
<video id="v" src="./video.mp4" width="1920" height="1080" preload="auto" playsinline></video>
<button id="b" type="button" aria-label="Play or pause">Play</button>
<script>
  const v = document.getElementById("v"), b = document.getElementById("b");
  const toggle = () => { if (v.paused) v.play(); else v.pause(); };
  const label = () => { b.textContent = v.paused ? (v.ended ? "Replay" : "Play") : "Pause"; };
  b.addEventListener("click", toggle);
  v.addEventListener("click", toggle);
  ["play", "pause", "ended"].forEach(e => v.addEventListener(e, label));
  document.addEventListener("keydown", e => { if (e.code === "Space" && e.target !== b) { e.preventDefault(); toggle(); } });
</script>
</body>
</html>
